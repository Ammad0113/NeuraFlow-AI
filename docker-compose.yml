version: '3.8'

services:
  neuraflow-api:
    build: .
    container_name: neuraflow-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./neuraflow.db
    volumes:
      - ./storage:/app/storage

  neuraflow-ui:
    build: .
    container_name: neuraflow-ui
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - neuraflow-api
